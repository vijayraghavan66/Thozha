[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-link-host"
version = "0.1.0"
description = "Outbound Jarvis Link host with an authenticated OpenJarvis supervisor adapter"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "httpx>=0.27", "websockets>=15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
